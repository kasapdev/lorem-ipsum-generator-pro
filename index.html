<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Generate placeholder text — classic Latin lorem ipsum plus themed word banks, in words, sentences, paragraphs or list items. Fast, private, offline.">
  <title>Lorem Ipsum Generator — Web Utility Suite</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar container">
    <a class="brand" href="https://github.com/kasapdev/web-utility-suite" aria-label="Back to Web Utility Suite">
      <span class="logo" aria-hidden="true">
        <!-- text lines icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
      </span>
      <span class="col" style="gap:0">
        <span>Lorem Ipsum Generator</span>
        <span class="sub">Web Utility Suite</span>
      </span>
    </a>
    <span class="spacer"></span>

    <span id="statusBadge" class="badge" role="status" aria-live="polite" title="Output status">
      <span class="status-dot" aria-hidden="true"></span><span id="statusText">Ready</span>
    </span>

    <button class="btn btn--icon" data-shortcut-help title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/>
      </svg>
    </button>
    <button class="btn btn--icon" data-theme-toggle title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <main class="container">
    <!-- Options -->
    <section class="panel toolbar-panel fade-in" aria-label="Generator options">
      <div class="toolbar">
        <div class="toolbar-group">
          <div class="field-inline">
            <label for="unitSelect">Unit</label>
            <select id="unitSelect" aria-label="Unit to generate">
              <option value="words">Words</option>
              <option value="sentences">Sentences</option>
              <option value="paragraphs" selected>Paragraphs</option>
              <option value="list">List items</option>
            </select>
          </div>
          <div class="field-inline">
            <label for="countInput">Count</label>
            <input type="number" id="countInput" min="1" max="500" value="5" style="width:88px" aria-label="How many units to generate">
          </div>
          <div class="field-inline">
            <label for="bankSelect">Word bank</label>
            <select id="bankSelect" aria-label="Word bank theme">
              <option value="classic" selected>Classic Latin</option>
              <option value="tech">Tech Jargon</option>
              <option value="corporate">Corporate Buzzwords</option>
              <option value="scifi">Space &amp; Sci-Fi</option>
            </select>
          </div>
        </div>

        <span class="spacer hide-sm"></span>

        <div class="toolbar-group">
          <label class="check" title="Prepend the classic opening clause">
            <span class="switch">
              <input type="checkbox" id="startClassic" checked aria-label="Start with classic Lorem ipsum dolor sit amet">
              <span class="track"></span><span class="thumb"></span>
            </span>
            <span class="secondary">Start with "Lorem ipsum…"</span>
          </label>
          <label class="check" title="Wrap output in HTML tags">
            <span class="switch">
              <input type="checkbox" id="htmlOutput" aria-label="Wrap output in HTML tags">
              <span class="track"></span><span class="thumb"></span>
            </span>
            <span class="secondary">HTML tags</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Output -->
    <section class="editor rise" aria-label="Generated text">
      <div class="pane panel pane--output" style="grid-column: 1 / -1">
        <div class="pane-head">
          <h2 class="pane-title">Output</h2>
          <span id="outputStats" class="muted pane-meta mono">0 words · 0 chars</span>
        </div>

        <div class="output-scroll">
          <pre id="output" class="output-code mono" aria-live="polite" tabindex="0"><code id="outputCode"></code></pre>

          <div id="emptyState" class="empty output-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h10"/>
            </svg>
            <p>Your generated text will appear here.</p>
            <button id="btnGenerateEmpty" class="btn btn--sm">Generate text</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Actions -->
    <section class="panel toolbar-panel fade-in" aria-label="Actions" style="margin-top:var(--space-5)">
      <div class="toolbar">
        <div class="toolbar-group">
          <button id="btnGenerate" class="btn btn--primary" title="Generate (Ctrl/Cmd+Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
            Generate
          </button>
          <button id="btnCopy" class="btn btn--sm" title="Copy output">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
          <button id="btnDownload" class="btn btn--sm" title="Download output">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Download
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer container">
    Part of the <a href="https://github.com/kasapdev/web-utility-suite">Web Utility Suite</a> · MIT Licensed
  </footer>

  <!-- Shortcuts help modal -->
  <div id="helpBackdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <div class="row between center" style="margin-bottom:var(--space-4)">
        <h3 id="helpTitle" style="margin:0">Keyboard shortcuts</h3>
        <button id="helpClose" class="btn btn--icon btn--ghost" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <table class="shortcut-table">
        <tbody id="shortcutRows"></tbody>
      </table>
      <p class="muted" style="margin:var(--space-4) 0 0;font-size:13px">Tip: <kbd>mod</kbd> means <kbd>Ctrl</kbd> on Windows/Linux and <kbd>⌘</kbd> on macOS.</p>
    </div>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
